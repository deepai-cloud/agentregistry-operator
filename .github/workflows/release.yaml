name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Independent main builds must not replace each other's pending publish runs.
  group: release-${{ github.ref_type == 'tag' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      chart_registry: ${{ steps.release.outputs.chart_registry }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      snapshot: ${{ steps.release.outputs.snapshot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.4'
          cache: false
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - name: Derive release coordinates
        id: release
        run: python3 scripts/release-coordinates.py
      - name: Verify code, chart, and examples
        run: make verify
      - name: Build versioned installable packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: make package VERSION="$VERSION" IMAGE="$IMAGE"
      - name: Retain the verified release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: dist/*
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    if: github.repository == 'deepai-cloud/agentregistry-operator'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: dist
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the operator and gateway image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.verify.outputs.image }}
          labels: |
            org.opencontainers.image.title=AgentRegistry Operator
            org.opencontainers.image.description=Kubernetes operator and gateway for AgentRegistry
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Publish the Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          CHART_REGISTRY: ${{ needs.verify.outputs.chart_registry }}
        shell: bash
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/agentregistry-operator-$VERSION.tgz" "$CHART_REGISTRY"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ${{ needs.verify.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_REGISTRY: ${{ needs.verify.outputs.chart_registry }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          SNAPSHOT: ${{ needs.verify.outputs.snapshot }}
        shell: bash
        run: |
          # Markdown code spans use literal backticks.
          # shellcheck disable=SC2016
          {
            printf 'Operator and gateway image: `%s`\n\n' "$IMAGE"
            printf 'Image manifest digest: `%s`\n\n' "$IMAGE_DIGEST"
            printf 'Helm chart: `%s/agentregistry-operator`, version `%s`.\n\n' "$CHART_REGISTRY" "$VERSION"
            printf 'The chart selects the published image and bundles Metacontroller; no local image build is required.\n\n'
            printf 'Downloads include the chart, source/examples bundle, Linux amd64 and arm64 operator/gateway binaries, and SHA256SUMS.\n\n'
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'See the [installation guide](%s/%s/blob/%s/docs/installation.md).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > "$RUNNER_TEMP/release-notes.md"
          assets=(
            "dist/agentregistry-operator-$VERSION.tgz"
            "dist/agentregistry-operator-$VERSION-bundle.tar.gz"
            "dist/agentregistry-operator-$VERSION-linux-amd64.tar.gz"
            "dist/agentregistry-operator-$VERSION-linux-arm64.tar.gz"
            dist/SHA256SUMS
          )
          release_flags=()
          if [[ "$PRERELEASE" == true ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          # Development tags are created at the exact tested commit. Versioned
          # releases require the tag which triggered the workflow to exist.
          if [[ "$SNAPSHOT" != true ]]; then
            release_flags+=(--verify-tag)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A rerun can finish an interrupted upload without creating a duplicate.
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            edit_flags=(--draft=false --prerelease="$PRERELEASE")
            if [[ "$PRERELEASE" == true ]]; then
              edit_flags+=(--latest=false)
            fi
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${edit_flags[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${release_flags[@]}" "${assets[@]}"
          fi
