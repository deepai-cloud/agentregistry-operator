name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      chart_registry: ${{ steps.release.outputs.chart_registry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.4'
          cache: false
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - name: Derive release coordinates
        id: release
        shell: bash
        run: |
          # deepai-cloud/agentregistry-operator publishes the image at
          # ghcr.io/deepai-cloud/agentregistry-operator and the chart under /charts.
          python3 - <<'PY'
          import os
          import runpy

          package = runpy.run_path("scripts/package.py")
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if not package["VERSION_PATTERN"].fullmatch(version):
              raise SystemExit("Release tags must be vMAJOR.MINOR.PATCH with an optional SemVer prerelease")
          PY
          {
            printf 'version=%s\n' "${GITHUB_REF_NAME#v}"
            printf 'image=ghcr.io/%s:%s\n' "${GITHUB_REPOSITORY,,}" "$GITHUB_REF_NAME"
            printf 'chart_registry=oci://ghcr.io/%s/charts\n' "${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"
      - name: Verify code, chart, and examples
        run: make verify
      - name: Build versioned installable packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: make package VERSION="$VERSION" IMAGE="$IMAGE"
      - name: Retain the verified release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: dist
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the operator and gateway image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.verify.outputs.image }}
          labels: |
            org.opencontainers.image.title=AgentRegistry Operator
            org.opencontainers.image.description=Kubernetes operator and gateway for AgentRegistry
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Publish the Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          CHART_REGISTRY: ${{ needs.verify.outputs.chart_registry }}
        shell: bash
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/agentregistry-operator-$VERSION.tgz" "$CHART_REGISTRY"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ${{ needs.verify.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_REGISTRY: ${{ needs.verify.outputs.chart_registry }}
        shell: bash
        run: |
          # Markdown code spans use literal backticks.
          # shellcheck disable=SC2016
          {
            printf 'Operator and gateway image: `%s`\n\n' "$IMAGE"
            printf 'Image manifest digest: `%s`\n\n' "$IMAGE_DIGEST"
            printf 'Helm chart: `%s/agentregistry-operator`, version `%s`.\n\n' "$CHART_REGISTRY" "$VERSION"
            printf 'The chart includes the release image and bundled Metacontroller; no local image build is required.\n\n'
            printf 'See the [installation guide](%s/%s/blob/%s/docs/installation.md).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          } > "$RUNNER_TEMP/release-notes.md"
          release_flags=()
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_flags[@]}" \
            "dist/agentregistry-operator-$VERSION.tgz" \
            "dist/agentregistry-operator-$VERSION-bundle.tar.gz" \
            dist/SHA256SUMS
