{{- $metacontroller := index .Subcharts "metacontroller" -}}
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRoleBinding",
  "metadata": {
    "name": {{ printf "%s-metacontroller" .Release.Name | quote }},
    "labels": {{ include "agentregistry-operator.labels" . }}
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "ClusterRole",
    "name": {{ printf "%s-metacontroller" .Release.Name | quote }}
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": {{ include "metacontroller.serviceAccountName" $metacontroller | quote }},
      "namespace": {{ include "metacontroller.namespace" $metacontroller | quote }}
    }
  ]
}
