{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": {{ .Release.Name | quote }},
    "labels": {{ include "agentregistry-operator.labels" . }},
    "namespace": {{ .Release.Namespace | quote }}
  },
  "spec": {
    "replicas": {{ .Values.replicaCount }},
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "agentregistry-operator",
        "app.kubernetes.io/instance": {{ .Release.Name | quote }}
      }
    },
    "template": {
      "metadata": {
        "annotations": {{ .Values.podAnnotations | toJson }},
        "labels": {
          "app.kubernetes.io/name": "agentregistry-operator",
          "app.kubernetes.io/instance": {{ .Release.Name | quote }}
        }
      },
      "spec": {
        "nodeSelector": {{ .Values.nodeSelector | toJson }},
        "tolerations": {{ .Values.tolerations | toJson }},
        "affinity": {{ .Values.affinity | toJson }},
        "serviceAccountName": {{ .Release.Name | quote }},
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 65532,
          "runAsGroup": 65532,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "operator",
            "image": {{ include "agentregistry-operator.image" . | quote }},
            "imagePullPolicy": {{ .Values.image.pullPolicy | quote }},
            "command": [
              "/operator"
            ],
            "env": [
              {
                "name": "GATEWAY_IMAGE",
                "value": {{ include "agentregistry-operator.image" . | quote }}
              }
            ],
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "resources": {{ .Values.resources | toJson }},
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": "http"
              },
              "initialDelaySeconds": 2,
              "periodSeconds": 10
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": "http"
              },
              "initialDelaySeconds": 2,
              "periodSeconds": 10
            }
          }
        ]
      }
    }
  }
}
