{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRole",
  "metadata": {
    "name": {{ printf "%s-metacontroller" .Release.Name | quote }},
    "labels": {{ include "agentregistry-operator.labels" . }}
  },
  "rules": [
    {
      "apiGroups": [
        "metacontroller.k8s.io"
      ],
      "resources": [
        "compositecontrollers",
        "decoratorcontrollers",
        "controllerrevisions"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "apiextensions.k8s.io"
      ],
      "resources": [
        "customresourcedefinitions"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "persistentvolumeclaims",
        "namespaces"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "registry.deepai.cloud"
      ],
      "resources": [
        "agentregistries"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "update",
        "patch"
      ]
    },
    {
      "apiGroups": [
        "registry.deepai.cloud"
      ],
      "resources": [
        "agentregistries/status"
      ],
      "verbs": [
        "get",
        "update",
        "patch"
      ]
    },
    {
      "apiGroups": ["registry.deepai.cloud"],
      "resources": ["agentregistries/finalizers"],
      "verbs": ["update"]
    },
    {
      "apiGroups": [
        "apps"
      ],
      "resources": [
        "deployments",
        "statefulsets"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "create",
        "update",
        "patch",
        "delete"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "services",
        "serviceaccounts",
        "secrets",
        "configmaps"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "create",
        "update",
        "patch",
        "delete"
      ]
    },
    {
      "apiGroups": [
        "networking.k8s.io"
      ],
      "resources": [
        "networkpolicies"
      ],
      "verbs": [
        "get",
        "list",
        "watch",
        "create",
        "update",
        "patch",
        "delete"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "events"
      ],
      "verbs": [
        "create",
        "update",
        "patch"
      ]
    }
  ]
}
